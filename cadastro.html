<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança - cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>ONG Esperança</h1>
        <nav>
            <ul>
                <li><a href="index.html">início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <section>
      <h2>Cadastro de Colaborador</h2>
      <form id="formCadastro">
        <div>
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" required minlength="3">
        </div>

        <div>
          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required pattern="\(\d{2}\) \d{5}-\d{4}">
        </div>

        <div>
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required pattern="\d{5}-\d{3}">
        </div>

        <button type="submit">Enviar Cadastro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
